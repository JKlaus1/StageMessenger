# Stage Messenger v2.4 / v4.1 -- keep the desktop (kiosk) session's PipeWire OFF the WING and the X32's X-LIVE / X-USB card.
# Installed to ~/.config/wireplumber/wireplumber.conf.d/ by mixer/setup_pi_playback.sh.
#
# The rack Pi runs a desktop session (lightdm -> openbox -> Chromium kiosk) with PipeWire +
# WirePlumber. Left alone, WirePlumber claims the WING as a sink/source and opens hw:WING whenever
# anything in that session plays audio -- which would lock out Spotify (go-librespot, ALSA
# wing_pi) and the listen-back capture, or play browser sounds into the console.
# The WING is driven only through plain ALSA (/etc/asound.conf).
#
# WirePlumber 0.5 (Debian trixie: 0.5.8). Matches any WING / X-LIVE / X-USB, not just this serial number
# (this one is alsa_card.usb-BEHRINGER_WING_01001VN0604AAE214-00).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-BEHRINGER_WING*" }
      { device.name = "~alsa_card.usb-.*X.?LIVE.*" }
      { device.name = "~alsa_card.usb-.*X.?USB.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
