# Stage Messenger v2.4 -- go-librespot (Spotify Connect) config. Written against go-librespot v0.10.3
# (its config_schema.json is saved next to the binary in ~/go-librespot/releases/<tag>/).
# Linked as ~/.config/go-librespot/config.yml by mixer/setup_spotify.sh. go-librespot reads it at
# start only:  sudo systemctl restart go-librespot  after a change.
# The saved Spotify login lives in ~/.config/go-librespot/state.json -- a credential, NOT in git.

device_name: Stage Rig
device_type: speaker
log_level: info

# Audio: stereo -> WING USB in 1/2 (AUX 1) through the shared dmix in /etc/asound.conf.
audio_backend: alsa
audio_device: wing_pi
bitrate: 320

# Fixed volume: full scale always; the Spotify app's slider does not scale the audio.
# The WING AUX 1 fader is the only level control.
external_volume: true
volume_steps: 100
initial_volume: 100
ignore_last_volume: true

# Show behaviour: when a playlist/album ends, stop (no Spotify "autoplay" radio). Track loudness
# normalisation stays on (default) so songs play at similar levels.
disable_autoplay: true

# Sign-in: device code (spotify.com/pair) -- only this account sees "Stage Rig". Zeroconf stays OFF
# so nobody else on the same Wi-Fi can take over the speaker. Re-pair: stop the service, delete
# state.json, start it, and approve the new code (shown in the journal and on /mixer).
credentials:
  type: device_auth
zeroconf_enabled: false

# Venue networks: try Spotify on ports 443/80 before 4070.
prefer_firewall_friendly_ports: true

# Library browsing on /mixer (v2.5): track metadata cache behind GET /context/tracks (playlist / album /
# Liked Songs listings) and status.next_track. Fetched via Spotify's internal API, not the public Web API.
metadata:
  enabled: true

# Local control API -- localhost only. Stage Messenger proxies it under /mixer (Cloudflare Access).
server:
  enabled: true
  address: 127.0.0.1
  port: 3678
