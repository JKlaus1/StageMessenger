# Stage Messenger v2.4 -- Pi -> WING USB playback.  Installed to /etc/asound.conf by
# mixer/setup_pi_playback.sh (system-wide, so services running as any user can use it).
#
# The WING Rack's USB interface is 48 ch in / 48 ch out, S24_3LE, 48 kHz only.
# Capture (listen-back: `arecord -D hw:WING`) and playback are separate PCM streams and run
# side by side (verified 2026-10-05).
#
#   wing_dmix  shared 48-channel playback on hw:WING (several programs may play at once)
#   wing_pi    stereo in -> WING USB in 1/2 (any format/rate; converted to 48 kHz S24_3LE).
#              On the console USB 1/2 is a stereo pair feeding AUX 1.
#
# Verified on hardware 2026-10-05: two simultaneous players, period 1024 / buffer 4096.

pcm.wing_dmix {
  type dmix
  ipc_key 4815
  ipc_perm 0666
  slave {
    pcm "hw:WING"
    channels 48
    format S24_3LE
    rate 48000
    period_size 1024
    buffer_size 4096
  }
}

pcm.wing_pi {
  type plug
  slave.pcm {
    type route
    slave { pcm "wing_dmix"  channels 48 }
    ttable.0.0 1
    ttable.1.1 1
  }
}
