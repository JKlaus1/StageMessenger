# Stage Messenger v2.4 / v4.1 -- Pi -> console USB playback.  Installed to /etc/asound.conf by
# mixer/setup_pi_playback.sh (system-wide, so services running as any user can use it).
#
# WING Rack USB: 48 ch in / 48 ch out, S24_3LE, 48 kHz only.
# X32 / M32 with an X-LIVE (or X-USB) card: 32 ch in / 32 ch out, S24_3LE, at the console's clock
# (48 kHz assumed here -- same as the listen-back capture; a 44.1 kHz console needs `rate 44100`).
# Capture (listen-back: `arecord -D hw:WING` / `hw:XLIVE`) and playback are separate PCM streams
# and run side by side (verified on the WING 2026-10-05).
#
#   wing_dmix   shared 48-channel playback on hw:WING (several programs may play at once)
#   wing_pi     stereo in -> WING USB in 1/2 (any format/rate; converted to 48 kHz S24_3LE).
#               On the console USB 1/2 is a stereo pair feeding AUX 1.
#   xlive_dmix  shared 32-channel playback on hw:XLIVE
#   xlive_pi    stereo in -> X32 Card in 1/2 (the console's "Card 1/2" input source). Console-side
#               return is the user's choice: Routing > Aux In Remap = Card 1-4 puts it on Aux In 1/2,
#               or route an input block / user-in to Card 1-2 for a channel.
#   spotify_out what go-librespot plays to: wing_pi or xlive_pi, chosen by the STAGE_RIG_PCM
#               environment variable (mixer/spotify.py writes ~/.config/go-librespot/console.env
#               for whichever console is connected and restarts go-librespot). Default wing_pi.
#
# Verified on hardware 2026-10-05 (WING): two simultaneous players, period 1024 / buffer 4096.

pcm.wing_dmix {
  type dmix
  ipc_key 4815
  ipc_perm 0666
  slave {
    pcm "hw:WING"
    channels 48
    format S24_3LE
    rate 48000
    period_size 1024
    buffer_size 4096
  }
}

pcm.wing_pi {
  type plug
  slave.pcm {
    type route
    slave { pcm "wing_dmix"  channels 48 }
    ttable.0.0 1
    ttable.1.1 1
  }
}

pcm.xlive_dmix {
  type dmix
  ipc_key 4816
  ipc_perm 0666
  slave {
    pcm "hw:XLIVE"
    channels 32
    format S24_3LE
    rate 48000
    period_size 1024
    buffer_size 4096
  }
}

pcm.xlive_pi {
  type plug
  slave.pcm {
    type route
    slave { pcm "xlive_dmix"  channels 32 }
    ttable.0.0 1
    ttable.1.1 1
  }
}

pcm.spotify_out {
  type plug
  slave.pcm {
    @func getenv
    vars [ STAGE_RIG_PCM ]
    default "wing_pi"
  }
}
