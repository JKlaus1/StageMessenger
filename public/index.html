<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="/pwa.js"></script>
  <link rel="icon" href="/pwa/messenger-192.png">
  <link rel="apple-touch-icon" href="/pwa/messenger-192.png">
  <title>Stage Messenger</title>
  <script src="/socket.io.min.js"></script>
  <script src="/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:  #00ff88;
      --bg:     #0d0d1a;
      --card:   #14142a;
      --border: #2a2a4a;
      --text:   #e0e0f0;
      --muted:  #55557a;
      --fade:   0.3s ease;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ══ SCREEN SYSTEM ════════════════════════════════════════════════════════ */
    .screen {
      position: absolute; inset: 0;
      transition: opacity var(--fade);
    }
    .screen.hidden { opacity: 0; pointer-events: none; }

    /* ══ JOIN SCREEN ══════════════════════════════════════════════════════════ */
    #join-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem;
      gap: 0;
      overflow-y: auto;
    }

    #join-logo {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 900;
      color: var(--green);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    #join-sub {
      font-size: clamp(0.65rem, 2vw, 0.8rem);
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    #qr-wrap {
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 1.5rem;
      display: inline-block;
      line-height: 0;
    }

    #qr-hint {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin-top: -1rem;
      margin-bottom: 1.5rem;
    }

    .join-field-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
      align-self: flex-start;
      width: min(88vw, 360px);
    }

    #name-input {
      width: min(88vw, 360px);
      padding: 0.9rem 1rem;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
      outline: none;
      caret-color: var(--green);
      -webkit-appearance: none;
      margin-bottom: 0.75rem;
    }

    #name-input:focus { border-color: var(--green); }

    /* Sender toggle */
    #sender-toggle-wrap {
      width: min(88vw, 360px);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 0.75rem;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s;
    }

    #sender-toggle-wrap.active {
      border-color: var(--green);
      background: rgba(0,255,136,0.06);
    }

    #sender-checkbox {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-radius: 5px;
      background: transparent;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    #sender-toggle-wrap.active #sender-checkbox {
      background: var(--green);
      border-color: var(--green);
      color: #000;
    }

    #sender-toggle-text {
      flex: 1;
    }

    #sender-toggle-text strong {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
    }

    #sender-toggle-text span {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 500;
    }

    #join-error {
      width: min(88vw, 360px);
      font-size: 0.72rem;
      color: #ff5555;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      min-height: 1rem;
      margin-bottom: 0.5rem;
    }

    #join-btn {
      width: min(88vw, 360px);
      padding: 1rem;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.12s;
    }

    #join-btn:active  { opacity: 0.75; }
    #join-btn:disabled { background: #333; color: #555; }

    /* ══ RECEIVER SCREEN (clock) ══════════════════════════════════════════════ */
    #receiver-screen {
      background: #000;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      cursor: none;
    }

    #clock-time    { font-size: 26vw; font-weight: 900; color: var(--green); letter-spacing: -0.04em; line-height: 1; font-family: 'Arial Black', Arial, sans-serif; }
    #clock-seconds { font-size: 7vw; color: #00aa55; font-weight: 700; letter-spacing: 0.05em; margin-top: -1vw; font-family: 'Arial Black', Arial, sans-serif; }
    #clock-date    { font-size: 3.5vw; color: #333; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 1.5vw; font-family: 'Arial Black', Arial, sans-serif; }

    /* ══ SENDER SCREEN ════════════════════════════════════════════════════════ */
    #sender-screen {
      display: flex; flex-direction: column;
      padding: 0.75rem 0.9rem 1.5rem;
      overflow-y: auto;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Sender header */
    #sender-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #sender-id {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--green);
    }

    #sender-status {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted);
    }

    #sender-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #sender-dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #sender-dot.off { background: #ff4444; }

    /* Online count */
    #online-count {
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }

    /* Quick messages */
    .s-label {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
      flex-shrink: 0;
    }

    .sender-quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin-bottom: 0.9rem;
      flex-shrink: 0;
    }

    .sq-btn {
      padding: 0.75rem 0.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      transition: all 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .sq-btn:active { background: #1e1e3a; transform: scale(0.97); }

    /* Color row */
    .sender-color-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.9rem;
      flex-shrink: 0;
    }

    .s-color-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .s-color-dot.active { border-color: #fff; transform: scale(1.18); }

    /* Custom message */
    .sender-input-wrap {
      position: relative;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    #song-input {
      width: 100%;
      padding: 0.75rem 3rem 0.75rem 0.9rem;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      outline: none;
      caret-color: var(--green);
      -webkit-appearance: none;
    }
    #sender-msg-input {
      width: 100%;
      padding: 0.75rem 3rem 0.75rem 0.9rem;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      outline: none;
      caret-color: var(--green);
      -webkit-appearance: none;
    }

    #sender-msg-input::placeholder { color: #222244; font-weight: 400; text-transform: none; letter-spacing: 0; }
    #sender-msg-input:focus { border-color: var(--green); }

    #sender-char-count {
      position: absolute;
      right: 0.65rem; top: 50%;
      transform: translateY(-50%);
      font-size: 0.58rem; color: var(--muted); font-weight: 600;
    }

    #sender-send-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.12s, transform 0.1s, background 0.2s;
      flex-shrink: 0;
    }

    #sender-send-btn:active { opacity: 0.8; transform: scale(0.98); }
    #sender-send-btn.sent   { background: #00cc66; }


    /* Key grid */
    .key-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.3rem;
      margin-bottom: 0.6rem;
      flex-shrink: 0;
    }
    .key-btn {
      padding: 0.7rem 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .key-btn.active {
      border-color: var(--green);
      background: rgba(0,255,136,0.12);
      color: var(--green);
    }
    .majmin-row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
      flex-shrink: 0;
    }
    .majmin-btn {
      flex: 1;
      padding: 0.6rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .majmin-btn.active {
      border-color: var(--green);
      color: var(--green);
      background: rgba(0,255,136,0.08);
    }
    #song-send-btn {
      width: 100%;
      padding: 0.95rem;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.12s, transform 0.1s, background 0.2s;
      flex-shrink: 0;
    }
    #song-send-btn:active { opacity: 0.8; transform: scale(0.98); }
    #song-send-btn.sent   { background: #00cc66; }
    .sender-divider {
      height: 1px;
      background: var(--border);
      margin: 1.1rem 0 0.9rem;
      flex-shrink: 0;
    }

    /* ══ MESSAGE OVERLAY (shared) ═════════════════════════════════════════════ */
    #msg-overlay {
      position: fixed; inset: 0;
      z-index: 999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 5vw;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      font-family: 'Arial Black', Arial, sans-serif;
      cursor: pointer;
    }

    #msg-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #msg-text {
      font-size: min(22vw, 42vh);
      font-weight: 900;
      color: #000;
      line-height: 1.05;
      word-break: normal;
      overflow-wrap: normal;
      width: 100%;
    }

    #msg-from {
      font-size: min(4.5vw, 6vh);
      font-weight: 900;
      color: rgba(0,0,0,0.5);
      line-height: 1;
      letter-spacing: 0.05em;
      max-width: 96%;
      word-break: break-word;
    }
    #msg-key {
      font-size: min(5vw, 7vh);
      font-weight: 900;
      color: rgba(0,0,0,0.75);
      line-height: 1.05;
    }

    #msg-hint {
      position: absolute;
      bottom: 1.5rem;
      font-size: max(2vw, 12px);
      color: rgba(0,0,0,0.35);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #msg-bar-wrap {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 8px; background: rgba(0,0,0,0.2);
    }
    #msg-bar { height: 100%; width: 100%; background: rgba(0,0,0,0.35); }

    /* Shared badge + conn dot (receiver) */
    #device-badge {
      position: absolute;
      top: 1.2rem; right: 1.5rem;
      font-size: max(1.5vw, 11px);
      color: #2a2a2a;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'Arial Black', Arial, sans-serif;
    }

    #conn-dot {
      position: absolute;
      bottom: 1rem; left: 1.2rem;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #222;
      transition: background 0.4s;
    }
    #conn-dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #conn-dot.off { background: #ff4444; }

    /* Flash animation */
    @keyframes flash {
      0%   { background: var(--fc); }
      13%  { background: #fff; }
      26%  { background: var(--fc); }
      39%  { background: #fff; }
      52%  { background: var(--fc); }
      65%  { background: #fff; }
      78%  { background: var(--fc); }
      100% { background: var(--fc); }
    }

    #msg-overlay.flashing { animation: flash 0.75s ease-in-out forwards; }
  </style>
</head>
<body>

  <!-- ══ JOIN SCREEN ══════════════════════════════════════════════════════════ -->
  <div class="screen" id="join-screen">
    <div id="join-logo">🎸 Stage Messenger</div>
    <div id="join-sub">Live show comms</div>

    <div id="qr-wrap"><div id="qrcode"></div></div>
    <div id="qr-hint">Scan to join on another device</div>

    <div class="join-field-label">Your name</div>
    <input id="name-input" type="text" maxlength="16"
           placeholder="E.G. SARAH"
           autocomplete="off" autocorrect="off"
           autocapitalize="characters" spellcheck="false">

    <div id="sender-toggle-wrap">
      <div id="sender-checkbox"></div>
      <div id="sender-toggle-text">
        <strong>I want to send messages</strong>
        <span>Lets you send cues to the whole band</span>
      </div>
    </div>

    <div id="join-error"></div>
    <button id="join-btn">Join</button>
  </div>

  <!-- ══ RECEIVER SCREEN ═════════════════════════════════════════════════════ -->
  <div class="screen hidden" id="receiver-screen">
    <div id="clock-time">00:00</div>
    <div id="clock-seconds">:00</div>
    <div id="clock-date">Mon Jan 1</div>
    <div id="device-badge"></div>
    <div id="conn-dot"></div>
  </div>

  <!-- ══ SENDER SCREEN ═══════════════════════════════════════════════════════ -->
  <div class="screen hidden" id="sender-screen">

    <div id="sender-header">
      <div id="sender-id">🎤 —</div>
      <div id="sender-status">
        <div id="sender-dot" class="off"></div>
        <span id="sender-status-text">Offline</span>
      </div>
    </div>

    <div id="online-count">No other devices connected</div>

    <div class="s-label">Next Song</div>
    <div class="sender-input-wrap">
      <input type="text" id="song-input"
             placeholder="Song name…"
             maxlength="30"
             autocomplete="off" autocorrect="off"
             autocapitalize="characters" spellcheck="false">
    </div>

    <div class="s-label">Key</div>
    <div class="key-grid">
      <button class="key-btn" data-key="C">C</button>
      <button class="key-btn" data-key="Db">Db</button>
      <button class="key-btn" data-key="D">D</button>
      <button class="key-btn" data-key="Eb">Eb</button>
      <button class="key-btn" data-key="E">E</button>
      <button class="key-btn" data-key="F">F</button>
      <button class="key-btn" data-key="Gb">Gb</button>
      <button class="key-btn" data-key="G">G</button>
      <button class="key-btn" data-key="Ab">Ab</button>
      <button class="key-btn" data-key="A">A</button>
      <button class="key-btn" data-key="Bb">Bb</button>
      <button class="key-btn" data-key="B">B</button>
    </div>

    <div class="majmin-row">
      <button class="majmin-btn active" data-mode="maj">Major</button>
      <button class="majmin-btn" data-mode="min">Minor</button>
    </div>

    <div style="display:flex;gap:0.4rem;margin-bottom:0.5rem;">
      <button id="clear-key-btn" style="flex:1;padding:0.55rem;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;">✕ Clear Key</button>
      <button id="clear-all-btn" style="flex:1;padding:0.55rem;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;">✕ Clear All</button>
    </div>
    <button id="song-send-btn">Send Song + Key</button>

    <div class="sender-divider"></div>

    <div class="s-label">Quick Message</div>
    <div class="sender-input-wrap">
      <input type="text" id="sender-msg-input"
             placeholder="Type a message…"
             maxlength="160"
             autocomplete="off" autocorrect="off"
             autocapitalize="characters" spellcheck="false">
      <span id="sender-char-count">0/160</span>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:0.3rem;margin-bottom:0.5rem;">
      <button id="clear-sender-msg-btn" style="background:transparent;border:none;color:var(--muted);font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;padding:0.15rem 0.5rem;-webkit-tap-highlight-color:transparent;">✕ Clear</button>
    </div>
    <button id="sender-send-btn">Send Message</button>

  </div>

  <!-- ══ MESSAGE OVERLAY (over everything) ══════════════════════════════════ -->
  <div id="msg-overlay">
    <div id="msg-from"></div>
    <div id="msg-text"></div>
    <div id="msg-key"></div>
    <div id="msg-hint">TAP TO DISMISS</div>
    <div id="msg-bar-wrap"><div id="msg-bar"></div></div>
  </div>

  <script>
    // ── QR code ────────────────────────────────────────────────────────────────
    const joinUrl = `${window.location.protocol}//${window.location.host}/`;
    new QRCode(document.getElementById('qrcode'), {
      text: joinUrl,
      width: 140, height: 140,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });

    // ── Clock ──────────────────────────────────────────────────────────────────
    const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function tick() {
      const now = new Date();
      const hh  = String(now.getHours() % 12 || 12).padStart(2, '0');
      const mm  = String(now.getMinutes()).padStart(2, '0');
      const ss  = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock-time').textContent    = `${hh}:${mm}`;
      document.getElementById('clock-seconds').textContent = `:${ss}`;
      document.getElementById('clock-date').textContent    =
        `${DAYS[now.getDay()]}  ${MONTHS[now.getMonth()]} ${now.getDate()}`;
    }
    tick();
    setInterval(tick, 1000);

    // ── Text auto-sizer ────────────────────────────────────────────────────────
    // Single-line fit for sender name and key — no wrapping allowed.
    function fitSingleLine(el) {
      if (!el || !el.textContent.trim()) return;
      let px = parseFloat(window.getComputedStyle(el).fontSize);
      el.style.fontSize = px + 'px';
      while (px > 10) {
        const tooWide = el.scrollWidth > el.parentElement.clientWidth * 0.94;
        const wrapped = el.offsetHeight > px * 1.5;
        if (!tooWide && !wrapped) break;
        px -= 2;
        el.style.fontSize = px + 'px';
      }
    }

    // Binary search for largest font that fits the height budget.
    function fitMessageText(overlay, from, text, key) {
      if (!text.textContent.trim()) return;
      const availH     = window.innerHeight * 0.82;
      const fromH      = from.textContent.trim() ? from.offsetHeight : 0;
      const keyH       = key.textContent.trim()  ? key.offsetHeight  : 0;
      const gapH       = (fromH && keyH) ? 16 : (fromH || keyH) ? 8 : 0;
      const textAvailH = Math.max(availH - fromH - keyH - gapH, 30);
      const availW     = overlay.clientWidth * 0.90;

      // Force element to correct width before measuring
      text.style.width    = availW + 'px';
      text.style.maxWidth = availW + 'px';

      // Binary search: checks both height and width so single words
      // shrink to fit on one line without breaking mid-character
      let lo = 10, hi = 280;
      while (hi - lo > 2) {
        const mid = (lo + hi) >> 1;
        text.style.fontSize = mid + 'px';
        const fitsH = text.offsetHeight <= textAvailH;
        const fitsW = text.scrollWidth  <= availW + 2;
        if (fitsH && fitsW) lo = mid;
        else hi = mid - 1;
      }
      text.style.fontSize = lo + 'px';
    }

    // ── State ──────────────────────────────────────────────────────────────────
    let myRole         = 'receiver';   // 'receiver' | 'sender'
    let myName         = null;          // set after successful join
    let wantToSend     = false;
    // -- Auto-join from URL params
    const _urlp        = new URLSearchParams(window.location.search);
    const autoJoinName = (_urlp.get('name') || '').trim().toUpperCase().slice(0, 16);
    const autoJoinRole = _urlp.get('role') === 'sender' ? 'sender' : 'receiver';

    // ── Screens ────────────────────────────────────────────────────────────────
    const joinScreen     = document.getElementById('join-screen');
    const receiverScreen = document.getElementById('receiver-screen');
    const senderScreen   = document.getElementById('sender-screen');

    function showScreen(which) {
      [joinScreen, receiverScreen, senderScreen].forEach(s => s.classList.add('hidden'));
      which.classList.remove('hidden');
    }

    // ── Sender toggle ──────────────────────────────────────────────────────────
    const senderToggleWrap = document.getElementById('sender-toggle-wrap');
    const senderCheckbox   = document.getElementById('sender-checkbox');

    senderToggleWrap.addEventListener('click', () => {
      wantToSend = !wantToSend;
      senderToggleWrap.classList.toggle('active', wantToSend);
      senderCheckbox.textContent = wantToSend ? '✓' : '';
    });

    // ── Message overlay ────────────────────────────────────────────────────────
    const msgOverlay = document.getElementById('msg-overlay');
    const msgText    = document.getElementById('msg-text');
    const msgFrom    = document.getElementById('msg-from');
    const msgKey     = document.getElementById('msg-key');
    const msgBar     = document.getElementById('msg-bar');
    let   dismissTimer = null;

    function showMessage(data) {
      clearTimeout(dismissTimer);
      msgOverlay.classList.remove('flashing');

      const color    = data.color    || '#cc0000';
      const duration = data.duration || 30000;

      msgOverlay.style.setProperty('--fc', color);
      msgOverlay.style.background = color;
      msgFrom.textContent = data.from || '';
      msgText.textContent = (data.message || '').toUpperCase();
      msgKey.textContent  = data.subtitle || '';
      msgKey.style.display = data.subtitle ? 'block' : 'none';

      // Reset sizes before measuring
      msgFrom.style.fontSize = '';
      msgText.style.fontSize = '';
      msgKey.style.fontSize  = '';

      msgOverlay.classList.add('visible');

      requestAnimationFrame(() => {
        fitSingleLine(msgFrom);
        fitSingleLine(msgKey);
        fitMessageText(msgOverlay, msgFrom, msgText, msgKey);
        void msgOverlay.offsetWidth;
        msgOverlay.classList.add('flashing');
        setTimeout(() => msgOverlay.classList.remove('flashing'), 800);
      });

      // Progress bar
      msgBar.style.transition = 'none';
      msgBar.style.width = '100%';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        msgBar.style.transition = `width ${duration}ms linear`;
        msgBar.style.width = '0%';
      }));

      dismissTimer = setTimeout(dismissMessage, duration);
    }

    function dismissMessage() {
      clearTimeout(dismissTimer);
      msgOverlay.classList.remove('visible', 'flashing');
    }

    msgOverlay.addEventListener('click', dismissMessage);

    // ── Sender char count ──────────────────────────────────────────────────────
    const senderInput     = document.getElementById('sender-msg-input');
    const senderCharCount = document.getElementById('sender-char-count');
    senderInput.addEventListener('input', () => {
      senderCharCount.textContent = `${senderInput.value.length}/160`;
    });

    // ── Key selector ─────────────────────────────────────────────────────────
    let selectedKey  = null;
    let selectedMode = 'maj';

    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.key-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedKey = btn.dataset.key;
      });
    });

    document.querySelectorAll('.majmin-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.majmin-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMode = btn.dataset.mode;
      });
    });

    // ── Send song + key ────────────────────────────────────────────────────────
    const songInput = document.getElementById('song-input');

    function sendSong() {
      const song = songInput.value.trim();
      if (!song || !socket.connected) return;

      let subtitle = '';
      if (selectedKey) {
        subtitle = 'KEY OF ' + selectedKey + (selectedMode === 'min' ? 'm' : '');
      }

      socket.emit('send-message', {
        targets:  ['all'],
        message:  song,
        subtitle: subtitle,
        color:    '#0066cc',
        duration: 30000,
      });

      const btn = document.getElementById('song-send-btn');
      btn.textContent = 'Sent ✓';
      btn.classList.add('sent');
      setTimeout(() => {
        btn.textContent = 'Send Song + Key';
        btn.classList.remove('sent');
      }, 1200);
    }

    document.getElementById('song-send-btn').addEventListener('click', sendSong);
    songInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendSong(); });

    // ── Clear buttons ─────────────────────────────────────────────────────────
    function clearKey() {
      selectedKey = null;
      document.querySelectorAll('.key-btn').forEach(b => b.classList.remove('active'));
    }

    document.getElementById('clear-key-btn').addEventListener('click', clearKey);

    document.getElementById('clear-all-btn').addEventListener('click', () => {
      songInput.value = '';
      clearKey();
      selectedMode = 'maj';
      document.querySelectorAll('.majmin-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.mode === 'maj'));
      senderInput.value = '';
      document.getElementById('sender-char-count').textContent = '0/160';
    });

    document.getElementById('clear-sender-msg-btn').addEventListener('click', () => {
      senderInput.value = '';
      document.getElementById('sender-char-count').textContent = '0/160';
    });

    // ── Send ───────────────────────────────────────────────────────────────────
    function sendMessage() {
      const msg = senderInput.value.trim();
      if (!msg || !socket.connected) return;
      socket.emit('send-message', {
        targets:  ['all'],
        message:  msg,
        subtitle: '',
        color:    '#dd6600',
        duration: 30000,
      });
      const btn = document.getElementById('sender-send-btn');
      btn.textContent = 'Sent ✓';
      btn.classList.add('sent');
      setTimeout(() => {
        btn.textContent = 'Send Message';
        btn.classList.remove('sent');
      }, 1200);
    }

    document.getElementById('sender-send-btn').addEventListener('click', sendMessage);
    senderInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    // ── Online count (sender view) ─────────────────────────────────────────────
    function updateOnlineCount(devices) {
      const count = devices.length;
      const el = document.getElementById('online-count');
      if (count === 0) {
        el.textContent = 'No other devices connected';
      } else {
        const names = devices.map(d => d.name).join(', ');
        el.textContent = `${count} online: ${names}`;
      }
    }

    // ── Socket.io ──────────────────────────────────────────────────────────────
    const connDot    = document.getElementById('conn-dot');
    const senderDot  = document.getElementById('sender-dot');
    const senderStTx = document.getElementById('sender-status-text');
    const joinBtn    = document.getElementById('join-btn');
    const nameInput  = document.getElementById('name-input');
    const joinError  = document.getElementById('join-error');

    if (autoJoinName) {
      wantToSend = autoJoinRole === 'sender';
      nameInput.value = autoJoinName;
      if (wantToSend) { senderToggleWrap.classList.add('active'); senderCheckbox.textContent = '\u2713'; }
      joinBtn.disabled = true;
      joinBtn.textContent = 'Joining...';
    }
    const socket = io();

    function setConnected(yes) {
      const cls = yes ? 'on' : 'off';
      connDot.className  = cls;
      senderDot.className = cls;
      senderStTx.textContent = yes ? 'Live' : 'Offline';
    }

    socket.on('connect', () => {
      setConnected(true);
      if (myName) {
        // Re-register with stored name after reconnect
        socket.emit('register', {
          type:    'personal',
          role:    myRole,
          name:    myName,
          canSend: myRole === 'sender',
        });
      } else if (autoJoinName) {
        socket.emit('register', {
          type:    'personal',
          role:    autoJoinRole,
          name:    autoJoinName,
          canSend: autoJoinRole === 'sender',
        });
      }
    });
    socket.on('disconnect', () => setConnected(false));

    socket.on('register-accepted', (data) => {
      myName = data.name;
      myRole = data.role;
      joinError.textContent = '';

      if (myRole === 'sender') {
        document.getElementById('sender-id').textContent = `🎤 ${data.name}`;
        showScreen(senderScreen);
      } else {
        document.getElementById('device-badge').textContent = data.name;
        showScreen(receiverScreen);
      }
    });

    socket.on('register-rejected', (data) => {
      joinError.textContent = data.reason;
      joinBtn.disabled = false;
      joinBtn.textContent = 'Join';
      nameInput.focus();
    });

    socket.on('message', showMessage);
    socket.on('clear',   dismissMessage);

    socket.on('devices-updated', (devices) => {
      // Filter out self for the online count display
      updateOnlineCount(devices);
    });

    // ── Join form ──────────────────────────────────────────────────────────────
    if (!autoJoinName) nameInput.focus();

    function attemptJoin() {
      const name = nameInput.value.trim();
      if (!name) { joinError.textContent = 'Please enter a name.'; return; }
      joinError.textContent = '';
      joinBtn.disabled = true;
      joinBtn.textContent = 'Joining…';
      socket.emit('register', {
        type:    'personal',
        role:    wantToSend ? 'sender' : 'receiver',
        name,
        canSend: wantToSend,
      });
    }

    joinBtn.addEventListener('click', attemptJoin);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') attemptJoin(); });
    nameInput.addEventListener('input',   () => { joinError.textContent = ''; });

    // ── Reconnect on tab/app focus ─────────────────────────────────────────────
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        socket.disconnect();
        setTimeout(() => socket.connect(), 200);
      }
    });
  </script></body>
</html>
